name: kcu-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kcu-${{ github.ref }}
  cancel-in-progress: true

env:
  KCU_CF_API_KEY: ${{ secrets.KCU_CF_API_KEY }}
  KCU_MIRROR_BASE: ${{ vars.KCU_MIRROR_BASE }}
  KCU_BACKEND_BASE: ${{ vars.KCU_BACKEND_BASE }}
  KCU_LANG_PACK_BASE: ${{ vars.KCU_LANG_PACK_BASE }}
  KCU_DOWNLOAD_REGION: ${{ vars.KCU_DOWNLOAD_REGION }}
  RUSTUP_DIST_SERVER: https://mirrors.cloud.tencent.com/rustup
  RUSTUP_UPDATE_ROOT: https://mirrors.cloud.tencent.com/rustup/rustup
  CARGO_TERM_COLOR: never

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: toolchain
        run: |
          curl -sSfL --max-time 120 -o /tmp/kcu-rustup-init "$RUSTUP_UPDATE_ROOT/dist/x86_64-unknown-linux-gnu/rustup-init"
          chmod +x /tmp/kcu-rustup-init
          /tmp/kcu-rustup-init -y --profile minimal --default-toolchain stable --no-modify-path
      - name: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: kcu-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            kcu-cargo-${{ runner.os }}-
      - name: build
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo build --release --offline
      - name: test
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo test --offline
      - name: windows-abi-check
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          rustup target add x86_64-pc-windows-gnu
          cargo check --offline --target x86_64-pc-windows-gnu

      - name: env-presence
        run: |
          if [ -n "$KCU_CF_API_KEY" ]; then echo "KCU_CF_API_KEY=present"; else echo "KCU_CF_API_KEY=absent"; fi

  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: credential
        run: |
          if grep -rqE 'gh[p]_' .; then echo "CREDENTIAL_FOUND"; exit 1; else echo "NO_CREDENTIAL"; fi
      - name: wording
        run: |
          if grep -rE '为了|目的是|方便用户|让用户能够|这样用户' src/; then echo "EXPLANATORY_FOUND"; exit 1; else echo "NO_EXPLANATORY"; fi
      - name: hardcode
        run: |
          if grep -rE 'https?://|C:\\|x-api-key' src/; then echo "HARDCODE_FOUND"; exit 1; else echo "NO_HARDCODE"; fi
      - name: panic_guard
        run: python3 scripts/panic_guard.py
      - name: semver_guard
        run: python3 scripts/semver_guard.py
      - name: i18n_guard
        run: python3 scripts/i18n_guard.py
      - name: lang_guard
        run: python3 scripts/lang_guard.py
      - name: policy_guard
        run: python3 scripts/policy_guard.py
      - name: delivery_guard
        run: python3 scripts/delivery_guard.py
      - name: api_guard
        run: python3 scripts/api_guard.py
      - name: popup_guard
        run: python3 scripts/popup_guard.py
      - name: privacy_guard
        run: python3 scripts/privacy_guard.py
      - name: ai_gate_guard
        run: python3 scripts/ai_gate_guard.py
      - name: ax_guard
        run: python3 scripts/ax_guard.py
      - name: settings_guard
        run: python3 scripts/settings_guard.py
      - name: download_history_guard
        run: python3 scripts/download_history_guard.py
      - name: extension_gate_guard
        run: python3 scripts/extension_gate_guard.py
      - name: launch_progress_guard
        run: python3 scripts/launch_progress_guard.py
      - name: download_sources_guard
        run: python3 scripts/download_sources_guard.py
      - name: instance_drop_guard
        run: python3 scripts/instance_drop_guard.py
      - name: banner_design_guard
        run: python3 scripts/banner_design_guard.py
      - name: widget_layout_guard
        run: python3 scripts/widget_layout_guard.py
      - name: appearance_guard
        run: python3 scripts/appearance_guard.py
      - name: first_run_guard
        run: python3 scripts/first_run_guard.py
      - name: skin_draft_guard
        run: python3 scripts/skin_draft_guard.py
      - name: upgrade_plan_guard
        run: python3 scripts/upgrade_plan_guard.py
      - name: search_filter_guard
        run: python3 scripts/search_filter_guard.py
      - name: generator_session_guard
        run: python3 scripts/generator_session_guard.py
      - name: seed_access_guard
        run: python3 scripts/seed_access_guard.py
      - name: lan_channel_guard
        run: python3 scripts/lan_channel_guard.py
      - name: notice_center_guard
        run: python3 scripts/notice_center_guard.py
      - name: world_editor_guard
        run: python3 scripts/world_editor_guard.py
