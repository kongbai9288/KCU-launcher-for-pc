[package]
name = "ed25519-compact"
version = "2.6.1"
authors = ["Frank Denis <github@pureftpd.org>"]
edition = "2018"
description = "Ed25519 digital signatures and X25519 key exchange in pure Rust, with no_std and WebAssembly support"
readme = "README.md"
keywords = ["ed25519", "x25519", "eddsa", "signature", "no-std"]
repository = "https://github.com/jedisct1/rust-ed25519-compact"
homepage = "https://github.com/jedisct1/rust-ed25519-compact"
categories = ["algorithms", "cryptography", "no-std", "wasm"]
license = "MIT"
include = ["/src/**/*.rs", "!/src/ex25519.rs", "/README.md", "/LICENSE"]

[features]
default = ["std"]
self-verify = []
blind-keys = []
std = []
opt_size = []
disable-signatures = []
x25519 = []


