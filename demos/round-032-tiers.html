<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCU · 032 用户可选松档</title>
<style>
:root{--paper:#F1EFE8;--ink:#2C2C2A;--teal:#3D6B66;--red:#B8543F;--line:rgba(40,40,38,.10);--card:rgba(255,255,255,.72);--muted:#6B6B66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"Segoe UI","WenQuanYi Micro Hei",sans-serif;padding:18px}
h1{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.wrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.flow{display:flex;flex-direction:column;gap:5px;max-height:700px;overflow:auto}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--teal)}.node.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.node.q{border-left:3px solid var(--red)}.node.on.q{background:var(--red);border-color:var(--red)}
.node .n{font:600 11px Georgia,serif;opacity:.7;margin-right:6px}.node .t{font-weight:600}.node .d{font-size:11px;opacity:.75;margin-left:20px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin:10px 0}.kv b{font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-height:112px}
.mini h3{font:600 12.5px Georgia,serif;margin:0 0 5px;color:var(--teal)}.mini p{margin:3px 0;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;margin:2px 3px 0 0}.badge.g{color:var(--teal);border-color:var(--teal)}.badge.r{color:var(--red);border-color:var(--red)}
pre{background:#262624;color:#EDEAE1;border-radius:8px;padding:12px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;margin:0;max-height:250px}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.tag{font:600 10.5px Georgia,serif;color:var(--red);letter-spacing:.4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;border-left:2px solid var(--teal);padding-left:9px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>032 运行逻辑</h1><div class="sub">用户可选松档 · 日志门面库化 · 非整页 UX 演示</div>
<div class="bar"><button class="pri" onclick="run()">▶ 逐步执行</button><button onclick="reset()">重置</button></div>
<div class="flow" id="flow"></div></div>
<div><div class="card"><div class="kv"><b>当前步骤</b><span id="step">—</span><b>阶段</b><span id="phase">待执行</span><b>统一信封</b><span id="env">—</span></div>
<div class="grid">
<div class="mini"><h3>A01 三档</h3><p id="m1">未运行</p><span class="badge g">严格默认</span><span class="badge r">标准可切</span><span class="badge r">宽松可切</span></div>
<div class="mini"><h3>A01 不可变边界</h3><p id="m2">未运行</p><span class="badge r">二次确认</span><span class="badge r">插件禁切</span><span class="badge r">外传仍确认</span></div>
<div class="mini"><h3>A01 界面</h3><p id="m3">未运行</p><span class="badge g">3 张档位卡</span><span class="badge g">五类勾选</span><span class="badge">3 张新图</span></div>
<div class="mini"><h3>B01 日志门面</h3><p id="m4">未运行</p><span class="badge g">log 0.4.35</span><span class="badge g">153 / 0</span><span class="badge">零传递依赖</span></div>
</div><div class="note" id="note">默认严格不变；切档只能用户本人做。Q-031-01 字母歧义这次没答复，仍挂着。</div></div>
<div class="card log"><div class="tag">[KCU] 诊断行 / 统一信封</div><pre id="out">等待执行…</pre></div></div></div>
<script>
const NODES=[
['01','开工预检','读索引 156 项、031 严格档、024 映射'],
['02','指令拆分','「用户可选松档」= A 轨；「干」= B 轨继续替换'],
['03','逐字落盘','32-round-032-instructions.txt'],
['04','默认不变','031 的 Q1-C + Q2-A 保留为默认严格档'],
['05','三档矩阵','严格 / 标准 / 宽松，两个维度都单调变松'],
['06','不可变边界','U01-U07：默认回严格、二次确认、审计、外传硬闸'],
['07','后果更新','R01 夜间失效可补救；R04 勾选 C3 后才发命令'],
['08','界面闸门','三张档位卡 + 切换确认 + 五类勾选，出 3 图'],
['09','i18n 修正','031 分组 27 处中文 key 改 auto.* 语义 key'],
['10','log crate','v0.4.35 零依赖，裁 optional/dev/features 引用'],
['11','log.rs 重写','删 push/flush，实现 log::Log，Mutex 内部可变'],
['12','测试回归','153 passed / 0 failed，11 包 10 第三方'],
['13','提交推送','双扫描 → 本地提交 → 远端快照比对']];
const DETAIL={'01':'REQ 156/156 OK','02':'BRANCH A=tiers B=replace','03':'SPEC cmp 0','04':'DEFAULT strict Q1-C Q2-A','05':'MATRIX strict<standard<loose','06':'BOUND U01-U07 plugin_deny=1','07':'R01 fix=user_opt_in R04 c3_gated','08':'UI tier_cards=3 shots=3','09':'I18N cn_keys_rewritten=27','10':'VENDOR log 0.4.35 transdeps=0','11':'LOGFACADE impl Log push=0','12':'TEST 153 passed 0 failed','13':'PUSH remote_snapshot ALL_MATCH'};
const PHASE={'01':'开工预检','02':'指令拆分','03':'逐字落盘','04':'默认档','05':'档位设计','06':'边界设计','07':'后果更新','08':'界面闸门','09':'文案修正','10':'依赖核查','11':'代码替换','12':'测试回归','13':'提交推送'};
const QN=new Set(['04','05','06','07','08','09']);
const M={'05':['m1','严格 Q1-C+Q2-A / 标准 Q1-B+Q2-C / 宽松 Q1-A+Q2-D；确认粒度与动作范围两个维度都不倒挂。'],'06':['m2','新装与重置回严格；切档二次确认可取消；插件不能替用户切；每条命中仍审计；C5 外传永远二次确认且默认脱敏。'],'08':['m3','设置内三张档位卡，当前档徽章与「恢复严格」常驻；非严格档五类勾选带风险小字；出 46/47/48 三张图。'],'12':['m4','自写 push/flush 全删，换 log 0.4.35 的 Log trait；diagnostics 新增 emit；零传递依赖，153/0。']};
let lines=[];const flow=document.getElementById('flow');
NODES.forEach((n,i)=>{const d=document.createElement('div');d.className='node'+(QN.has(n[0])?' q':'');d.id='nd'+i;d.innerHTML='<span class="n">'+n[0]+'</span><span class="t">'+n[1]+'</span><div class="d">'+n[2]+'</div>';d.onclick=()=>paint(i);flow.appendChild(d);});
function envelope(i){const k=['core.start','core.branch','core.spec','q.default','q.matrix','q.bound','q.effect','ui.gate','ui.i18n','core.vendor','core.log','core.test','core.push'];return 'kcu-'+String(i+1).padStart(8,'0')+' '+k[i]+' '+i+1+' OK';}
function paint(i){document.querySelectorAll('.node').forEach((e,j)=>e.classList.toggle('on',j===i));const n=NODES[i];document.getElementById('step').textContent=n[0]+' · '+n[1];document.getElementById('phase').textContent=PHASE[n[0]];document.getElementById('env').textContent=envelope(i);const dom=QN.has(n[0])?'q':'core';const line='[KCU] '+n[0]+' '+dom+' '+n[0]+' OK '+DETAIL[n[0]];lines=lines.slice(0,i);lines.push(line);document.getElementById('out').textContent=lines.join('\n');for(let k=1;k<=i+1;k++){const key=String(k).padStart(2,'0');if(M[key])document.getElementById(M[key][0]).textContent=M[key][1];}if(i===12)document.getElementById('note').textContent='默认严格不变，用户可自己切松档；日志门面已库化。Q-031-01 字母歧义与自动命令实现层仍等你。';}
function run(){reset();let i=0;const t=setInterval(()=>{paint(i);i++;if(i>=NODES.length)clearInterval(t);},220);}
function reset(){lines=[];document.querySelectorAll('.node').forEach(e=>e.classList.remove('on'));document.getElementById('step').textContent='—';document.getElementById('phase').textContent='待执行';document.getElementById('env').textContent='—';['m1','m2','m3','m4'].forEach(x=>document.getElementById(x).textContent='未运行');document.getElementById('out').textContent='等待执行…';document.getElementById('note').textContent='默认严格不变；切档只能用户本人做。Q-031-01 字母歧义这次没答复，仍挂着。';}
</script></body></html>
