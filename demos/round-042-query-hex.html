<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCU · 042 批量 query 编码与身份哈希 hex 库化</title>
<style>
:root{--paper:#F1EFE8;--ink:#2C2C2A;--teal:#3D6B66;--red:#B8543F;--line:rgba(40,40,38,.10);--card:rgba(255,255,255,.72);--muted:#6B6B66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"Segoe UI","WenQuanYi Micro Hei",sans-serif;padding:18px}
h1{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.wrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.flow{display:flex;flex-direction:column;gap:5px;max-height:700px;overflow:auto}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--teal)}.node.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.node.q{border-left:3px solid var(--red)}.node.on.q{background:var(--red);border-color:var(--red)}
.node .n{font:600 11px Georgia,serif;opacity:.7;margin-right:6px}.node .t{font-weight:600}.node .d{font-size:11px;opacity:.75;margin-left:20px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin:10px 0}.kv b{font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-height:140px}
.mini h3{font:600 12.5px Georgia,serif;margin:0 0 5px;color:var(--teal)}.mini p{margin:3px 0;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;margin:2px 3px 0 0}.badge.g{color:var(--teal);border-color:var(--teal)}.badge.r{color:var(--red);border-color:var(--red)}
pre{background:#262624;color:#EDEAE1;border-radius:8px;padding:12px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;margin:0;max-height:250px}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.tag{font:600 10.5px Georgia,serif;color:var(--red);letter-spacing:.4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;border-left:2px solid var(--teal);padding-left:9px}
code{font:11px ui-monospace,Consolas,monospace;background:rgba(61,107,102,.08);padding:1px 4px;border-radius:3px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>042 运行逻辑</h1><div class="sub">两处自写编码交给库 · 非整页 UX 演示</div>
<div class="bar"><button class="pri" onclick="run()">▶ 逐步执行</button><button onclick="reset()">重置</button></div>
<div class="flow" id="flow"></div></div>
<div><div class="card"><div class="kv"><b>当前步骤</b><span id="step">—</span><b>阶段</b><span id="phase">待执行</span><b>统一信封</b><span id="env">—</span></div>
<div class="grid">
<div class="mini"><h3>041 收口</h3><p id="m1">未运行</p><span class="badge g">852 / 852</span><span class="badge g">ALL_MATCH</span><span class="badge g">凭据已清</span></div>
<div class="mini"><h3>缺陷：批量 id 被切坏</h3><p id="m2">未运行</p><span class="badge r">a&amp;b 变新参数</span><span class="badge r">中文坏 URI</span><span class="badge r">逗号误拆</span></div>
<div class="mini"><h3>两个零依赖库</h3><p id="m3">未运行</p><span class="badge g">percent-encoding 2.3.1</span><span class="badge g">hex 0.4.3</span><span class="badge g">MSRV 1.51</span></div>
<div class="mini"><h3>验证与自查</h3><p id="m4">未运行</p><span class="badge g">270 / 0</span><span class="badge g">原断言未改</span><span class="badge g">windows-gnu</span></div>
</div><div class="note" id="note">真实网络 IO、UI、崩溃分析未启动；Q-041 与 Q-037-01 仍等你答复。</div></div>
<div class="card log"><div class="tag">[KCU] 诊断行 / 统一信封</div><pre id="out">等待执行…</pre></div></div></div>
<script>
const NODES=[
['01','开工预检','补 041 远端比对、读 040/037/024 台账'],
['02','逐字落盘','42-round-042-instructions.txt'],
['03','定位自写编码','http.rs 的 ids.join / identity.rs 的 {:02x} 循环'],
['04','复现缺陷','a&b 被切成新参数、中文坏 URI、逗号误拆'],
['05','查真实 manifest','rust-url v2.5.0 子目录 / rust-hex v0.4.3'],
['06','版本不同步','v2.3.1 tag 里 manifest 写 2.2.0，2.3.1 在 v2.5.0'],
['07','vendor 与裁剪','裁 optional serde / bench / dev / docs.rs metadata'],
['08','许可三处齐备','4 份全文 + 关于页 22 组 + NOTICES 后才进 Cargo.toml'],
['09','query 编码落地','逐 id utf8_percent_encode，保留 unreserved'],
['10','E64 修复','NON_ALPHANUMERIC 会吃掉连字符，换 CONTROLS 自定义集合'],
['11','hex 落地与独立回归','hex::encode + Python hashlib 4 个期望值'],
['12','验证','270 测试、交叉检查、扫描、211 必读'],
['13','提交推送','本地提交、远端快照、逐项哈希比对']];
const DETAIL={'01':'REQ 205/205 OK 041_REMOTE 599edc7 ALL_MATCH True','02':'SPEC cmp 0','03':'SELF_WRITTEN http_join identity_format','04':'BUG id_ampersand_splits_query unicode_bad_uri','05':'MANIFEST rust_url_v2.5.0 rust_hex_v0.4.3','06':'A128 tag_v2.3.1_is_2.2.0 crate_2.3.1_at_v2.5.0','07':'VENDOR zero_deps no_c_chain','08':'LICENSE 3_places_ok then_dependency','09':'U54 utf8_percent_encode ID_ENCODE_SET','10':'E64 fixed assertions_unchanged','11':'U55-U56 hex_encode hashlib_reference','12':'TEST 244_lib + 26_int 270_total 0_failed PUSH ALL_MATCH','13':'PUSH ALL_MATCH'};
const PHASE={'01':'041 收口','02':'逐字落盘','03':'定位自写代码','04':'缺陷复现','05':'真实 manifest','06':'版本口径','07':'vendor 裁剪','08':'许可闸门','09':'query 编码','10':'失败修复','11':'hex 与回归','12':'验证','13':'提交推送'};
const QN=new Set(['03','04','05','06','07','09','10','11']);
const M={'01':['m1','041 上一轮工具结果不可用，这轮补跑：本地 ac9af80 ↔ 远端 599edc7，REMOTE 852 LOCAL 852 MISSING 0 EXTRA 0 MISMATCH 0 ALL_MATCH True，truncated=False。临时 PAT 已删，全仓 NO_CREDENTIAL，.git/config 干净。'],'04':['m2','040 把请求类型交给 http crate，但 ids 仍是 ids.join(",") 自己拼。一个 id 里的 & 会被解析成新参数，后面的 id 直接丢；# 会截断；逗号会误拆成两个条目；中文会让 Uri 解析失败。批量请求是对的，但 id 不编码就不成立。'],'07':['m3','`percent-encoding 2.3.1`（rust-url mono-repo 子 crate）：MIT OR Apache-2.0 / edition 2018 / MSRV 1.51 / 零依赖；`hex 0.4.3`：MIT OR Apache-2.0 / edition 2018 / 仅 optional serde。两个都零传递依赖、无 C 构建链、无 proc-macro。Cargo.lock 21 → 23 包 / 22 第三方，关于页 22 组 / 44。'],'12':['m4','244 单元 / 0 + 7 http_construct / 0 + 6 窗口契约 / 0 + 7 lifecycle / 0（36.19 s）+ 6 abi / 0（109.30 s）= **270 / 0**。cargo check --offline --target x86_64-pc-windows-gnu 通过，211 项必读非空，凭据 / 禁用词 / 同上 / P09 / hardcode 全零命中。界面闸门未触发，只重渲 4 张许可截图。']};
let lines=[];const flow=document.getElementById('flow');
NODES.forEach((n,i)=>{const d=document.createElement('div');d.className='node'+(QN.has(n[0])?' q':'');d.id='nd'+i;d.innerHTML='<span class="n">'+n[0]+'</span><span class="t">'+n[1]+'</span><div class="d">'+n[2]+'</div>';d.onclick=()=>paint(i);flow.appendChild(d);});
function envelope(i){const k=['core.start','core.spec','core.audit','q.defect','q.research','q.version','q.vendor','q.license','q.construct','q.fix','q.construct','core.verify','core.push'];return 'kcu-'+String(i+1).padStart(8,'0')+' '+k[i]+' '+i+1+' OK';}
function paint(i){document.querySelectorAll('.node').forEach((e,j)=>e.classList.toggle('on',j===i));const n=NODES[i];document.getElementById('step').textContent=n[0]+' · '+n[1];document.getElementById('phase').textContent=PHASE[n[0]];document.getElementById('env').textContent=envelope(i);const dom=QN.has(n[0])?'q':'core';const line='[KCU] '+n[0]+' '+dom+' '+n[0]+' OK '+DETAIL[n[0]];lines=lines.slice(0,i);lines.push(line);document.getElementById('out').textContent=lines.join('\n');for(let k=1;k<=i+1;k++){const key=String(k).padStart(2,'0');if(M[key])document.getElementById(M[key][0]).textContent=M[key][1];}if(i===12)document.getElementById('note').textContent='编码层已落地；Q-041 三选项、真实网络 IO 与崩溃分析仍等你。';}
function run(){reset();let i=0;const t=setInterval(()=>{paint(i);i++;if(i>=NODES.length)clearInterval(t);},220);}
function reset(){lines=[];document.querySelectorAll('.node').forEach(e=>e.classList.remove('on'));document.getElementById('step').textContent='—';document.getElementById('phase').textContent='待执行';document.getElementById('env').textContent='—';['m1','m2','m3','m4'].forEach(x=>document.getElementById(x).textContent='未运行');document.getElementById('out').textContent='等待执行…';document.getElementById('note').textContent='真实网络 IO、UI、崩溃分析未启动；Q-041 与 Q-037-01 仍等你答复。';}
</script></body></html>
