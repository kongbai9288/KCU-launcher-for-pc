<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCU · 036 上层第一块：Ed25519 签名校验</title>
<style>
:root{--paper:#F1EFE8;--ink:#2C2C2A;--teal:#3D6B66;--red:#B8543F;--line:rgba(40,40,38,.10);--card:rgba(255,255,255,.72);--muted:#6B6B66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"Segoe UI","WenQuanYi Micro Hei",sans-serif;padding:18px}
h1{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.wrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.flow{display:flex;flex-direction:column;gap:5px;max-height:700px;overflow:auto}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--teal)}.node.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.node.q{border-left:3px solid var(--red)}.node.on.q{background:var(--red);border-color:var(--red)}
.node .n{font:600 11px Georgia,serif;opacity:.7;margin-right:6px}.node .t{font-weight:600}.node .d{font-size:11px;opacity:.75;margin-left:20px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin:10px 0}.kv b{font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-height:118px}
.mini h3{font:600 12.5px Georgia,serif;margin:0 0 5px;color:var(--teal)}.mini p{margin:3px 0;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;margin:2px 3px 0 0}.badge.g{color:var(--teal);border-color:var(--teal)}.badge.r{color:var(--red);border-color:var(--red)}
pre{background:#262624;color:#EDEAE1;border-radius:8px;padding:12px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;margin:0;max-height:250px}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.tag{font:600 10.5px Georgia,serif;color:var(--red);letter-spacing:.4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;border-left:2px solid var(--teal);padding-left:9px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>036 运行逻辑</h1><div class="sub">上层第一块进构建 · 非整页 UX 演示</div>
<div class="bar"><button class="pri" onclick="run()">▶ 逐步执行</button><button onclick="reset()">重置</button></div>
<div class="flow" id="flow"></div></div>
<div><div class="card"><div class="kv"><b>当前步骤</b><span id="step">—</span><b>阶段</b><span id="phase">待执行</span><b>统一信封</b><span id="env">—</span></div>
<div class="grid">
<div class="mini"><h3>选这块的依据</h3><p id="m1">未运行</p><span class="badge g">纯算法零平台分支</span><span class="badge g">单 crate</span></div>
<div class="mini"><h3>依赖落地</h3><p id="m2">未运行</p><span class="badge g">零传递依赖</span><span class="badge g">MIT 全文</span><span class="badge r">无 windows-sys</span></div>
<div class="mini"><h3>U01–U07 口径</h3><p id="m3">未运行</p><span class="badge r">校验不可禁用</span><span class="badge r">回滚双条件</span><span class="badge g">失败保留旧插件</span></div>
<div class="mini"><h3>验证</h3><p id="m4">未运行</p><span class="badge g">179 / 0</span><span class="badge g">14 包 13 第三方</span></div>
</div><div class="note" id="note">上层能力第一次进构建；UI 宿主、真实网络、崩溃分析、插件 ABI 仍标未启动。</div></div>
<div class="card log"><div class="tag">[KCU] 诊断行 / 统一信封</div><pre id="out">等待执行…</pre></div></div></div>
<script>
const NODES=[
['01','开工预检','读索引 176 项、035 结尾两步、020 更新器约束'],
['02','逐字落盘','36-round-036-instructions.txt'],
['03','上层选路','UI/网络/崩溃/ABI 都带平台分支，签名校验纯算法'],
['04','核 ed25519-compact','2.6.1 三项依赖全 optional，cfg 门排除 pem/x25519'],
['05','vendor 落盘','裁 optional / dev / 三个 feature 引用，default=[std]'],
['06','许可三处齐备','MIT 全文 + 关于页七列表 + NOTICES 后才进 Cargo.toml'],
['07','U01 校验优先','verify 排在 decide 之前，失败直接 Keep'],
['08','U02–U03 版本','cmp_precedence 只升；同版本与 +build 差异 Keep'],
['09','U04 回滚双条件','显式目标 + 二次确认，只给一个仍 Reject'],
['10','U05–U06 兜底','签名/版本/截断输入一律保留旧插件，不 panic'],
['11','E32–E34 修复','Noise / anyhow Result / cmp_precedence 三处'],
['12','测试回归','179 passed / 0 failed，新增 15 测试'],
['13','提交推送','双扫描 → 本地提交 → 远端快照比对']];
const DETAIL={'01':'REQ 176/176 OK','02':'SPEC cmp 0','03':'ROUTE updater_signature pure_algo','04':'VENDOR ed25519-compact 2.6.1 transdeps=0','05':'UPSTREAM src_bytes_unchanged cfg_gated','06':'LICENSE 3_places_ok then_dependency','07':'U01 verify_before_decide','08':'U02-U03 cmp_precedence only_up','09':'U04 rollback_two_conditions','10':'U05-U06 keep_old no_panic','11':'E32-E34 fixed','12':'TEST 179 passed 0 failed','13':'PUSH remote_snapshot ALL_MATCH'};
const PHASE={'01':'开工预检','02':'逐字落盘','03':'上层选路','04':'依赖核查','05':'vendor 落盘','06':'许可闸门','07':'校验优先','08':'版本口径','09':'回滚口径','10':'兜底口径','11':'失败修复','12':'测试回归','13':'提交推送'};
const QN=new Set(['06','07','08','09','10']);
const M={'03':['m1','UI 宿主、真实网络、崩溃分析、插件 ABI 都带 Windows 平台分支或 C 构建链，当前 Linux 工具链无法验证 Win7 Tier 3；更新器签名校验是纯算法、平台无关，且是 020 写进硬约束的一块。'],'06':['m2','`ed25519-compact 2.6.1` 单 crate、零传递依赖、纯 Rust、无 libc / windows-sys / build.rs。LICENSE 全文（MIT, Frank Denis）、关于页七列表、NOTICES 三处齐了才写进 Cargo.toml。'],'10':['m3','签名校验不可禁用且排在版本决策之前；默认只升；同版本与 build 元数据差异 Keep；回滚需显式目标 + 二次确认；任何失败都返回 Keep 保留旧插件，截断输入走库错误路径不 panic。'],'12':['m4','164 → 179 / 0，新增 15 个测试（verify 6 + policy 9）；14 包 / 13 第三方，零传递依赖。']};
let lines=[];const flow=document.getElementById('flow');
NODES.forEach((n,i)=>{const d=document.createElement('div');d.className='node'+(QN.has(n[0])?' q':'');d.id='nd'+i;d.innerHTML='<span class="n">'+n[0]+'</span><span class="t">'+n[1]+'</span><div class="d">'+n[2]+'</div>';d.onclick=()=>paint(i);flow.appendChild(d);});
function envelope(i){const k=['core.start','core.spec','upper.route','core.vendor','core.upstream','core.license','q.verify','q.version','q.rollback','q.fallback','q.fix','core.test','core.push'];return 'kcu-'+String(i+1).padStart(8,'0')+' '+k[i]+' '+i+1+' OK';}
function paint(i){document.querySelectorAll('.node').forEach((e,j)=>e.classList.toggle('on',j===i));const n=NODES[i];document.getElementById('step').textContent=n[0]+' · '+n[1];document.getElementById('phase').textContent=PHASE[n[0]];document.getElementById('env').textContent=envelope(i);const dom=QN.has(n[0])?'q':'core';const line='[KCU] '+n[0]+' '+dom+' '+n[0]+' OK '+DETAIL[n[0]];lines=lines.slice(0,i);lines.push(line);document.getElementById('out').textContent=lines.join('\n');for(let k=1;k<=i+1;k++){const key=String(k).padStart(2,'0');if(M[key])document.getElementById(M[key][0]).textContent=M[key][1];}if(i===12)document.getElementById('note').textContent='上层第一块已库化；公钥来源与插件包格式未证实，其余上层能力仍等你。';}
function run(){reset();let i=0;const t=setInterval(()=>{paint(i);i++;if(i>=NODES.length)clearInterval(t);},220);}
function reset(){lines=[];document.querySelectorAll('.node').forEach(e=>e.classList.remove('on'));document.getElementById('step').textContent='—';document.getElementById('phase').textContent='待执行';document.getElementById('env').textContent='—';['m1','m2','m3','m4'].forEach(x=>document.getElementById(x).textContent='未运行');document.getElementById('out').textContent='等待执行…';document.getElementById('note').textContent='上层能力第一次进构建；UI 宿主、真实网络、崩溃分析、插件 ABI 仍标未启动。';}
</script></body></html>
