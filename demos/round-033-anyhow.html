<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCU · 033 歧义结案与错误类型库化</title>
<style>
:root{--paper:#F1EFE8;--ink:#2C2C2A;--teal:#3D6B66;--red:#B8543F;--line:rgba(40,40,38,.10);--card:rgba(255,255,255,.72);--muted:#6B6B66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"Segoe UI","WenQuanYi Micro Hei",sans-serif;padding:18px}
h1{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.wrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.flow{display:flex;flex-direction:column;gap:5px;max-height:700px;overflow:auto}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--teal)}.node.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.node.q{border-left:3px solid var(--red)}.node.on.q{background:var(--red);border-color:var(--red)}
.node .n{font:600 11px Georgia,serif;opacity:.7;margin-right:6px}.node .t{font-weight:600}.node .d{font-size:11px;opacity:.75;margin-left:20px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin:10px 0}.kv b{font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-height:112px}
.mini h3{font:600 12.5px Georgia,serif;margin:0 0 5px;color:var(--teal)}.mini p{margin:3px 0;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;margin:2px 3px 0 0}.badge.g{color:var(--teal);border-color:var(--teal)}.badge.r{color:var(--red);border-color:var(--red)}
pre{background:#262624;color:#EDEAE1;border-radius:8px;padding:12px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;margin:0;max-height:250px}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.tag{font:600 10.5px Georgia,serif;color:var(--red);letter-spacing:.4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;border-left:2px solid var(--teal);padding-left:9px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>033 运行逻辑</h1><div class="sub">Q-031-01 结案 · 错误类型库化 · 非整页 UX 演示</div>
<div class="bar"><button class="pri" onclick="run()">▶ 逐步执行</button><button onclick="reset()">重置</button></div>
<div class="flow" id="flow"></div></div>
<div><div class="card"><div class="kv"><b>当前步骤</b><span id="step">—</span><b>阶段</b><span id="phase">待执行</span><b>统一信封</b><span id="env">—</span></div>
<div class="grid">
<div class="mini"><h3>A01 歧义结案</h3><p id="m1">未运行</p><span class="badge g">A = answer 缩写</span><span class="badge g">031 口径不改</span></div>
<div class="mini"><h3>A01 不重做</h3><p id="m2">未运行</p><span class="badge g">三档保留</span><span class="badge g">界面闸门未触发</span></div>
<div class="mini"><h3>B01 路线核完</h3><p id="m3">未运行</p><span class="badge r">dirs 不成立</span><span class="badge g">改走错误类型</span></div>
<div class="mini"><h3>B01 anyhow</h3><p id="m4">未运行</p><span class="badge g">15 个签名</span><span class="badge g">153 / 0</span><span class="badge">零传递依赖</span></div>
</div><div class="note" id="note">「两个问题A」的 A 是 answer 缩写，不是选项字母。031 判定成立，032 三档不改。</div></div>
<div class="card log"><div class="tag">[KCU] 诊断行 / 统一信封</div><pre id="out">等待执行…</pre></div></div></div>
<script>
const NODES=[
['01','开工预检','读索引 161 项、031/032 结论、024 映射'],
['02','指令拆分','「是answer缩写」= A 轨结案；「干」= B 轨继续替换'],
['03','逐字落盘','33-round-033-instructions.txt'],
['04','结案 Q-031-01','A 是 answer 缩写，不是 Q1-A 选项字母'],
['05','口径不变','031 的 Q1-C + Q2-A / P01-P07 保留'],
['06','三档不变','032 三档矩阵与 U01-U11 保留，界面闸门未触发'],
['07','核 dirs 路线','paths.rs 是注入 root 映射，C:\\KCU 已定'],
['08','dirs 不成立','Windows 分支 windows-sys 大闭包不可验证，改轨'],
['09','选 anyhow','1.0.104 零依赖，MIT OR Apache-2.0'],
['10','vendor 落盘','src/ 与 build.rs 未改，裁 dev-dependencies'],
['11','15 签名换库','9 模块 Result<T,String> → anyhow::Result<T>'],
['12','测试回归','153 passed / 0 failed，12 包 11 第三方'],
['13','提交推送','双扫描 → 本地提交 → 远端快照比对']];
const DETAIL={'01':'REQ 161/161 OK','02':'BRANCH A=close B=replace','03':'SPEC cmp 0','04':'Q-031-01 answer_abbr closed','05':'KEEP Q1-C Q2-A P01-P07','06':'KEEP tiers U01-U11 ui_gate=off','07':'DIRS root_injected C_KCU_fixed','08':'DIRS FAIL windows_sys_unverifiable','09':'VENDOR anyhow 1.0.104 transdeps=0','10':'UPSTREAM src_bytes_unchanged','11':'RESULT 15_signatures 9_modules','12':'TEST 153 passed 0 failed','13':'PUSH remote_snapshot ALL_MATCH'};
const PHASE={'01':'开工预检','02':'指令拆分','03':'逐字落盘','04':'歧义结案','05':'口径核对','06':'三档核对','07':'路线核查','08':'改轨判定','09':'依赖核查','10':'vendor 落盘','11':'代码替换','12':'测试回归','13':'提交推送'};
const QN=new Set(['04','05','06','07','08']);
const M={'04':['m1','A = answer 缩写，意为「两个问题的答复」。031 按「最严格」取 Q1-C + Q2-A 的判定成立，不需要改成 Q1-A。'],'06':['m2','031 的 P01–P07、032 的三档矩阵与 U01–U11 全部保留；本轮不动界面，不触发整页 UX 演示闸门。'],'08':['m3','paths.rs 是「注入 root + 逻辑名 → 子路径」，用户已定 C:\\KCU；dirs 是系统目录定位，硬换改默认行为，且 windows-sys 大闭包在 Linux 工具链无法验证。改走错误类型。'],'12':['m4','9 模块 15 个 `Result<T, String>` 换 `anyhow::Result<T>`，`?` 直传保留原始错误；零传递依赖，153/0，12 包 11 第三方。']};
let lines=[];const flow=document.getElementById('flow');
NODES.forEach((n,i)=>{const d=document.createElement('div');d.className='node'+(QN.has(n[0])?' q':'');d.id='nd'+i;d.innerHTML='<span class="n">'+n[0]+'</span><span class="t">'+n[1]+'</span><div class="d">'+n[2]+'</div>';d.onclick=()=>paint(i);flow.appendChild(d);});
function envelope(i){const k=['core.start','core.branch','core.spec','q.close','q.keep','q.tiers','route.check','route.fail','core.vendor','core.upstream','core.error','core.test','core.push'];return 'kcu-'+String(i+1).padStart(8,'0')+' '+k[i]+' '+i+1+' OK';}
function paint(i){document.querySelectorAll('.node').forEach((e,j)=>e.classList.toggle('on',j===i));const n=NODES[i];document.getElementById('step').textContent=n[0]+' · '+n[1];document.getElementById('phase').textContent=PHASE[n[0]];document.getElementById('env').textContent=envelope(i);const dom=QN.has(n[0])?'q':'core';const line='[KCU] '+n[0]+' '+dom+' '+n[0]+' OK '+DETAIL[n[0]];lines=lines.slice(0,i);lines.push(line);document.getElementById('out').textContent=lines.join('\n');for(let k=1;k<=i+1;k++){const key=String(k).padStart(2,'0');if(M[key])document.getElementById(M[key][0]).textContent=M[key][1];}if(i===12)document.getElementById('note').textContent='歧义结案，031/032 口径不变；错误类型已库化。自动命令实现层与真实运行时仍等你。';}
function run(){reset();let i=0;const t=setInterval(()=>{paint(i);i++;if(i>=NODES.length)clearInterval(t);},220);}
function reset(){lines=[];document.querySelectorAll('.node').forEach(e=>e.classList.remove('on'));document.getElementById('step').textContent='—';document.getElementById('phase').textContent='待执行';document.getElementById('env').textContent='—';['m1','m2','m3','m4'].forEach(x=>document.getElementById(x).textContent='未运行');document.getElementById('out').textContent='等待执行…';document.getElementById('note').textContent='「两个问题A」的 A 是 answer 缩写，不是选项字母。031 判定成立，032 三档不改。';}
</script></body></html>
