<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KCU · 031 最严格口径与配置库化</title>
<style>
:root{--paper:#F1EFE8;--ink:#2C2C2A;--teal:#3D6B66;--red:#B8543F;--line:rgba(40,40,38,.10);--card:rgba(255,255,255,.72);--muted:#6B6B66}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:13px/1.6 -apple-system,"Segoe UI","WenQuanYi Micro Hei",sans-serif;padding:18px}
h1{font:600 20px/1.3 Georgia,"Songti SC",serif;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin-bottom:14px}
.wrap{max-width:1140px;margin:0 auto;display:grid;grid-template-columns:310px 1fr;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.flow{display:flex;flex-direction:column;gap:5px;max-height:700px;overflow:auto}
.node{border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;cursor:pointer;transition:.15s}
.node:hover{border-color:var(--teal)}.node.on{background:var(--teal);color:#fff;border-color:var(--teal)}
.node.q{border-left:3px solid var(--red)}.node.on.q{background:var(--red);border-color:var(--red)}
.node .n{font:600 11px Georgia,serif;opacity:.7;margin-right:6px}.node .t{font-weight:600}.node .d{font-size:11px;opacity:.75;margin-left:20px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
button{font:inherit;background:#fff;border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer;color:var(--ink)}button:hover{border-color:var(--teal)}button.pri{background:var(--teal);color:#fff;border-color:var(--teal)}
.kv{display:grid;grid-template-columns:120px 1fr;gap:5px 10px;font-size:12px;margin:10px 0}.kv b{font-weight:600;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;margin-top:12px}
.mini{border:1px solid var(--line);border-radius:8px;padding:9px;background:#fff;min-height:108px}
.mini h3{font:600 12.5px Georgia,serif;margin:0 0 5px;color:var(--teal)}.mini p{margin:3px 0;font-size:11.5px;color:var(--muted)}
.badge{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:10.5px;margin:2px 3px 0 0}.badge.g{color:var(--teal);border-color:var(--teal)}.badge.r{color:var(--red);border-color:var(--red)}
pre{background:#262624;color:#EDEAE1;border-radius:8px;padding:12px;overflow:auto;font:11.5px/1.55 ui-monospace,Consolas,monospace;margin:0;max-height:250px}
.log{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}.tag{font:600 10.5px Georgia,serif;color:var(--red);letter-spacing:.4px}
.note{font-size:11.5px;color:var(--muted);margin-top:10px;border-left:2px solid var(--teal);padding-left:9px}
</style></head><body>
<div class="wrap"><div class="card">
<h1>031 运行逻辑</h1><div class="sub">最严格口径 · 配置库化 · 非整页 UX 演示</div>
<div class="bar"><button class="pri" onclick="run()">▶ 逐步执行</button><button onclick="reset()">重置</button></div>
<div class="flow" id="flow"></div></div>
<div><div class="card"><div class="kv"><b>当前步骤</b><span id="step">—</span><b>阶段</b><span id="phase">待执行</span><b>统一信封</b><span id="env">—</span></div>
<div class="grid">
<div class="mini"><h3>A01 Q-028-01</h3><p id="m1">未运行</p><span class="badge r">Q1-C 每次都问</span><span class="badge r">夜间自动化失效</span></div>
<div class="mini"><h3>A01 Q-028-02</h3><p id="m2">未运行</p><span class="badge r">Q2-A 仅 C1 只读</span><span class="badge r">C2–C5 全部拒绝</span></div>
<div class="mini"><h3>界面闸门</h3><p id="m3">未运行</p><span class="badge g">设置内分组</span><span class="badge g">确认弹窗</span><span class="badge">2 张新图</span></div>
<div class="mini"><h3>B01 代码替换</h3><p id="m4">未运行</p><span class="badge g">serde_json::Map</span><span class="badge g">149 / 0</span><span class="badge">零新增依赖</span></div>
</div><div class="note" id="note">字母 A 与 Q1 选项冲突，按「最严格」判定为 Q1-C + Q2-A；Q-031-01 登记待确认。</div></div>
<div class="card log"><div class="tag">[KCU] 诊断行 / 统一信封</div><pre id="out">等待执行…</pre></div></div></div>
<script>
const NODES=[
['01','开工预检','读索引 151 项、030 场景文档、024 映射'],
['02','指令拆分','「按最严格」= A 轨拍板；「干」= B 轨继续替换'],
['03','逐字落盘','31-round-031-instructions.txt'],
['04','判定最严格','Q1-A 不是最严；Q1-C 每次同意 / Q2-A 只读白名单'],
['05','字母歧义','「A」与 Q1 选项冲突，以程度词为准，登记 Q-031-01'],
['06','功能 md','待拍板 → 已拍板，写 P01–P07 与 R01–R04'],
['07','规则文档','auto-command-policy.md：C1 允许，C2–C5 拒绝'],
['08','P05 收敛','一条待确认 + 累计计数，确认只作用当前一次'],
['09','界面闸门','设置内分组 + 命中确认弹窗，出 2 张预览图'],
['10','config.rs','双 BTreeMap → serde_json::Map，加 JSON 往返'],
['11','envelope.rs','payload → Map<String, Value>，加序列化'],
['12','测试回归','149 passed / 0 failed，零新增依赖'],
['13','提交推送','双扫描 → 本地提交 → 远端快照比对']];
const DETAIL={'01':'REQ 151/151 OK','02':'BRANCH A=strict B=replace','03':'SPEC cmp 0','04':'SELECT Q1-C + Q2-A strictest','05':'AMBIG Q-031-01 logged','06':'FUNC P01-P07 R01-R04','07':'POLICY C1=allow C2-C5=deny','08':'P05 pending=1 batch_count=7','09':'UI settings_tab=auto shots=2','10':'CONFIG Map json_roundtrip=ok','11':'ENVELOPE Map json_output=ok','12':'TEST 149 passed 0 failed','13':'PUSH remote_snapshot ALL_MATCH'};
const PHASE={'01':'开工预检','02':'指令拆分','03':'逐字落盘','04':'口径判定','05':'歧义登记','06':'结论落盘','07':'规则文档','08':'实现约束','09':'界面闸门','10':'配置库化','11':'信封库化','12':'测试回归','13':'提交推送'};
const QN=new Set(['04','05','06','07','08','09']);
const M={'04':['m1','Q1-A 是规则级一次性授权，不是最严；按「最严格」取 Q1-C 每次命中都手动同意。'],'06':['m2','Q2-A 只允许 C1 只读，C2–C5 一律拒绝并显示可见提示；F028-03 不会真向服务器发命令。'],'09':['m3','设置内「自动命令」分组，不进一级导航；命中确认弹窗可关、流程后 0 残留；出 44 / 45 两张预览图。'],'12':['m4','config 与 envelope 的 BTreeMap 清零，交给已在构建中的 serde_json::Map；149 / 0，10 包 9 第三方未变。']};
let lines=[];const flow=document.getElementById('flow');
NODES.forEach((n,i)=>{const d=document.createElement('div');d.className='node'+(QN.has(n[0])?' q':'');d.id='nd'+i;d.innerHTML='<span class="n">'+n[0]+'</span><span class="t">'+n[1]+'</span><div class="d">'+n[2]+'</div>';d.onclick=()=>paint(i);flow.appendChild(d);});
function envelope(i){const k=['core.start','core.branch','core.spec','q.select','q.ambig','q.conclude','q.policy','q.impl','ui.gate','core.config','core.envelope','core.test','core.push'];return 'kcu-'+String(i+1).padStart(8,'0')+' '+k[i]+' '+i+1+' OK';}
function paint(i){document.querySelectorAll('.node').forEach((e,j)=>e.classList.toggle('on',j===i));const n=NODES[i];document.getElementById('step').textContent=n[0]+' · '+n[1];document.getElementById('phase').textContent=PHASE[n[0]];document.getElementById('env').textContent=envelope(i);const dom=QN.has(n[0])?'q':'core';const line='[KCU] '+n[0]+' '+dom+' '+n[0]+' OK '+DETAIL[n[0]];lines=lines.slice(0,i);lines.push(line);document.getElementById('out').textContent=lines.join('\n');for(let k=1;k<=i+1;k++){const key=String(k).padStart(2,'0');if(M[key])document.getElementById(M[key][0]).textContent=M[key][1];}if(i===12)document.getElementById('note').textContent='两条 Q 按最严格落地；配置与信封的自写数据容器清零。Q-031-01 字母歧义与 R04 是否要真发命令，仍等你确认。';}
function run(){reset();let i=0;const t=setInterval(()=>{paint(i);i++;if(i>=NODES.length)clearInterval(t);},220);}
function reset(){lines=[];document.querySelectorAll('.node').forEach(e=>e.classList.remove('on'));document.getElementById('step').textContent='—';document.getElementById('phase').textContent='待执行';document.getElementById('env').textContent='—';['m1','m2','m3','m4'].forEach(x=>document.getElementById(x).textContent='未运行');document.getElementById('out').textContent='等待执行…';document.getElementById('note').textContent='字母 A 与 Q1 选项冲突，按「最严格」判定为 Q1-C + Q2-A；Q-031-01 登记待确认。';}
</script></body></html>
